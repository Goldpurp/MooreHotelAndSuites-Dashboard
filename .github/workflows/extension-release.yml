name: Chrome extension package

on:
  workflow_dispatch:
  push:
    tags:
      - "extension-v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify dashboard and extension
        run: |
          npm run typecheck
          npm test
          npm run build:production
          npm run extension:pack

      - name: Upload Chrome Web Store package
        uses: actions/upload-artifact@v4
        with:
          name: moore-hotels-chrome-extension
          path: release/*.zip
          if-no-files-found: error

      - name: Publish tagged package
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip \
            --generate-notes \
            --title "Moore Hotels Chrome Extension $GITHUB_REF_NAME"
