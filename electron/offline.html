<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moore Hotels & Suites — Connection unavailable</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #020617;
        color: #f8fafc;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 20% 10%, rgba(49, 69, 142, 0.24), transparent 38%),
          #020617;
      }
      main {
        width: min(100%, 460px);
        padding: 40px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.9);
        box-shadow: 0 32px 80px rgba(0, 0, 0, 0.35);
        text-align: center;
      }
      img {
        width: 76px;
        height: 76px;
        border-radius: 18px;
        margin-bottom: 20px;
      }
      h1 {
        margin: 0 0 12px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(28px, 8vw, 38px);
        line-height: 1.08;
      }
      p { margin: 0 0 28px; color: #94a3b8; line-height: 1.65; }
      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        border-radius: 12px;
        background: #c3944c;
        color: #fff;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="../build/icon.png" alt="" />
      <h1>Connection unavailable</h1>
      <p>
        Moore Hotels & Suites could not be reached. Check your internet connection,
        then try again.
      </p>
      <a href="https://admin.moorehotelandsuites.com/">Try again</a>
    </main>
  </body>
</html>
